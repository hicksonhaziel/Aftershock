name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Enable and verify isolated process tests
        shell: bash
        run: |
          if ! /usr/bin/unshare --user --map-root-user --net true; then
            for profile in /etc/apparmor.d/unshare /etc/apparmor.d/unshare-userns-restrict; do
              if [ -f "$profile" ]; then sudo apparmor_parser -R "$profile"; fi
            done
            sudo apparmor_parser -r config/ci/aftershock-unshare.apparmor
          fi
          /usr/bin/unshare --user --map-root-user --net true
      - run: pnpm check
      - run: pnpm db:up
      - run: pnpm db:check
      - run: pnpm test:regression
      - run: pnpm test:control
      - if: always()
        run: if [ -f .aftershock/dev-db.env ]; then pnpm db:down; fi
